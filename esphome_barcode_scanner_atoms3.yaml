substitutions:
  device_name: "atom-qrcode-scanner"

globals:
  # Persists across reboots so the on/off state survives a power cycle
  - id: scanner_enabled
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: scanning_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_barcode
    type: std::string
    restore_value: false
    initial_value: '""'

esphome:
  name: atom-qrcode-scanner
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - logger.log: "Initializing scanner..."
      # Set to RS232 mode (UART)
      - uart.write:
          id: uart_bus
          data: [0x21, 0x42, 0x40, 0x00]
      - delay: 200ms
      # Set to manual trigger mode
      - uart.write:
          id: uart_bus
          data: [0x21, 0x61, 0x41, 0x00]
      - delay: 200ms
      # Enable all barcodes
      - uart.write:
          id: uart_bus
          data: [0x32, 0x76, 0x42, 0x03]
      - delay: 200ms
      # Enable beeper
      - uart.write:
          id: uart_bus
          data: [0x21, 0x63, 0x46, 0x01]
      - delay: 200ms
      - logger.log: "Scanner initialization complete"
      - script.execute: update_led

esp32:
  board: m5stack-atoms3
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0

# Enable Home Assistant API
api:


ota:
  platform: esphome


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_name} Hotspot"
    password: "12345678"

captive_portal:


# Include the custom component
external_components:
  - source:
      type: local
      path: custom_components

# UART configuration
uart:
  id: uart_bus
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  tx_pin: GPIO6
  rx_pin: GPIO5
  rx_buffer_size: 1024

# Button for scanning
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Atom Button"
    id: atom_button
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    on_click:
      # Short press: trigger a single manual scan (only while enabled and idle)
      - min_length: 50ms
        max_length: 1000ms
        then:
          - if:
              condition:
                lambda: 'return id(scanner_enabled) && !id(scanning_active);'
              then:
                - lambda: 'id(scanning_active) = true;'
                - script.execute: update_led
                - logger.log: "Short press - triggering manual scan"
                - uart.write:
                    id: uart_bus
                    data: [0x32, 0x75, 0x01]  # Start decode
                - delay: 3s
                - uart.write:
                    id: uart_bus
                    data: [0x32, 0x75, 0x02]  # Stop decode
                - lambda: 'id(scanning_active) = false;'
                - script.execute: update_led
      # Long press (1s+): toggle the scanner on/off
      - min_length: 1000ms
        max_length: 10000ms
        then:
          - lambda: 'id(scanner_enabled) = !id(scanner_enabled);'
          - if:
              # If we were mid-scan when powered off, cleanly stop the decode session
              condition:
                lambda: 'return id(scanning_active) && !id(scanner_enabled);'
              then:
                - uart.write:
                    id: uart_bus
                    data: [0x32, 0x75, 0x02]  # Stop decode
                - lambda: 'id(scanning_active) = false;'
          - logger.log:
              format: "Long press - scanner turned %s"
              args: ['id(scanner_enabled) ? "ON" : "OFF"']
          - script.execute: update_led

# LED indicator (onboard WS2812 RGB LED)
# Red = off, Green = on/ready, Blue pulse = actively scanning, white flash = scan success
light:
  - platform: fastled_clockless
    chipset: WS2812
    pin: GPIO35
    num_leds: 1
    rgb_order: GRB
    name: "Scanner LED"
    id: led_indicator
    effects:
      - pulse:
          name: "Scanning Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 20%
          max_brightness: 100%

# Sets the LED to whatever the current state (on/off/scanning) calls for
script:
  - id: update_led
    then:
      - lambda: |-
          auto call = id(led_indicator).turn_on();
          if (id(scanning_active)) {
            call.set_effect("Scanning Pulse");
            call.set_rgb(0.0f, 0.0f, 1.0f);
          } else if (id(scanner_enabled)) {
            call.set_effect("None");
            call.set_rgb(0.0f, 1.0f, 0.0f);
          } else {
            call.set_effect("None");
            call.set_rgb(1.0f, 0.0f, 0.0f);
          }
          call.perform();

# Text sensor: only accept structurally valid EAN-5 / EAN-8 / EAN-13 codes.
# This replaces the old ad-hoc noise-string exclusion list entirely -- any
# protocol echo, partial/truncated read, or other garbage byte sequence from
# the scanner will simply fail these checks (wrong length, non-digit
# characters, or a bad check digit) and get dropped, so nothing else needed
# to special-case it.
text_sensor:
  - platform: uart_readline
    uart_id: uart_bus
    name: "Barcode Scanner"
    id: barcode_scanner
    icon: "mdi:barcode-scan"
    filters:
      # Validates EAN-5/8/13 structure AND flashes the result color, all in
      # one place, so there's exactly one flash decision per raw UART line
      # instead of risking a second, conflicting flash from on_value.
      #   orange = read something, but it failed validation (garbage/partial read)
      #   yellow = valid code, but the same one just read last time (repeat)
      #   white  = valid, new code (ok)
      - lambda: |-
          size_t len = x.length();
          bool valid = true;

          // Must be all ASCII digits
          for (char c : x) {
            if (c < '0' || c > '9') {
              valid = false;
              break;
            }
          }

          // Must be exactly EAN-5, EAN-8, or EAN-13 length
          if (valid && len != 5 && len != 8 && len != 13) {
            valid = false;
          }

          // EAN-8 / EAN-13: validate the GS1 modulo-10 check digit.
          // EAN-5 add-on codes carry no standard check digit, so length is
          // the only structural check available for them.
          if (valid && (len == 8 || len == 13)) {
            int sum = 0;
            bool weight_three = true;
            for (int i = (int) len - 2; i >= 0; i--) {
              int digit = x[i] - '0';
              sum += digit * (weight_three ? 3 : 1);
              weight_three = !weight_three;
            }
            int expected_check = (10 - (sum % 10)) % 10;
            int actual_check = x[len - 1] - '0';
            if (expected_check != actual_check) {
              valid = false;
            }
          }

          auto call = id(led_indicator).turn_on();
          call.set_effect("None");

          if (!valid) {
            call.set_rgb(1.0f, 0.5f, 0.0f);  // orange: invalid/rejected
            call.perform();
            return {};
          }

          if (x == id(last_barcode)) {
            call.set_rgb(1.0f, 1.0f, 0.0f);  // yellow: repeat of last code
            call.perform();
          } else {
            id(last_barcode) = x;
            call.set_rgb(1.0f, 1.0f, 1.0f);  // white: new, valid (ok)
            call.perform();
          }

          return x;
    on_value:
      then:
        - logger.log:
            format: "Barcode scanned: %s"
            args: ['x.c_str()']
        - delay: 500ms
        - script.execute: update_led

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

button:
  - platform: template
    name: "Test Manual Scan"
    on_press:
      - if:
          condition:
            lambda: 'return id(scanner_enabled) && !id(scanning_active);'
          then:
            - lambda: 'id(scanning_active) = true;'
            - script.execute: update_led
            - uart.write:
                id: uart_bus
                data: [0x32, 0x75, 0x01]
            - delay: 3s
            - uart.write:
                id: uart_bus
                data: [0x32, 0x75, 0x02]
            - lambda: 'id(scanning_active) = false;'
            - script.execute: update_led