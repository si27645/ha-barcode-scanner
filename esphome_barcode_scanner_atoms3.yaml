substitutions:
  device_name: "atom-qrcode-scanner"

globals:
  # Persists across reboots so the on/off state survives a power cycle
  - id: scanner_enabled
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: scanning_active
    type: bool
    restore_value: false
    initial_value: 'false'

esphome:
  name: atom-qrcode-scanner
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - logger.log: "Initializing scanner..."
      # Set to RS232 mode (UART)
      - uart.write:
          id: uart_bus
          data: [0x21, 0x42, 0x40, 0x00]
      - delay: 200ms
      # Set to manual trigger mode
      - uart.write:
          id: uart_bus
          data: [0x21, 0x61, 0x41, 0x00]
      - delay: 200ms
      # Enable all barcodes
      - uart.write:
          id: uart_bus
          data: [0x32, 0x76, 0x42, 0x03]
      - delay: 200ms
      # Enable beeper
      - uart.write:
          id: uart_bus
          data: [0x21, 0x63, 0x46, 0x01]
      - delay: 200ms
      - logger.log: "Scanner initialization complete"
      - script.execute: update_led

esp32:
  board: m5stack-atoms3
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0

# Enable Home Assistant API
api:


ota:
  platform: esphome


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_name} Hotspot"
    password: "12345678"

captive_portal:


# Include the custom component
external_components:
  - source:
      type: local
      path: custom_components

# UART configuration
uart:
  id: uart_bus
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  tx_pin: GPIO6
  rx_pin: GPIO5
  rx_buffer_size: 1024

# Button for scanning
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Atom Button"
    id: atom_button
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    on_click:
      # Short press: trigger a single manual scan (only while enabled and idle)
      - min_length: 50ms
        max_length: 1000ms
        then:
          - if:
              condition:
                lambda: 'return id(scanner_enabled) && !id(scanning_active);'
              then:
                - lambda: 'id(scanning_active) = true;'
                - script.execute: update_led
                - logger.log: "Short press - triggering manual scan"
                - uart.write:
                    id: uart_bus
                    data: [0x32, 0x75, 0x01]  # Start decode
                - delay: 3s
                - uart.write:
                    id: uart_bus
                    data: [0x32, 0x75, 0x02]  # Stop decode
                - lambda: 'id(scanning_active) = false;'
                - script.execute: update_led
      # Long press (1s+): toggle the scanner on/off
      - min_length: 1000ms
        max_length: 10000ms
        then:
          - lambda: 'id(scanner_enabled) = !id(scanner_enabled);'
          - if:
              # If we were mid-scan when powered off, cleanly stop the decode session
              condition:
                lambda: 'return id(scanning_active) && !id(scanner_enabled);'
              then:
                - uart.write:
                    id: uart_bus
                    data: [0x32, 0x75, 0x02]  # Stop decode
                - lambda: 'id(scanning_active) = false;'
          - logger.log:
              format: "Long press - scanner turned %s"
              args: ['id(scanner_enabled) ? "ON" : "OFF"']
          - script.execute: update_led

# LED indicator (onboard WS2812 RGB LED)
# Red = off, Green = on/ready, Blue pulse = actively scanning, white flash = scan success
light:
  - platform: fastled_clockless
    chipset: WS2812
    pin: GPIO35
    num_leds: 1
    rgb_order: GRB
    name: "Scanner LED"
    id: led_indicator
    effects:
      - pulse:
          name: "Scanning Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 20%
          max_brightness: 100%

# Sets the LED to whatever the current state (on/off/scanning) calls for
script:
  - id: update_led
    then:
      - lambda: |-
          auto call = id(led_indicator).turn_on();
          if (id(scanning_active)) {
            call.set_effect("Scanning Pulse");
            call.set_rgb(0.0f, 0.0f, 1.0f);
          } else if (id(scanner_enabled)) {
            call.set_effect("None");
            call.set_rgb(0.0f, 1.0f, 0.0f);
          } else {
            call.set_effect("None");
            call.set_rgb(1.0f, 0.0f, 0.0f);
          }
          call.perform();

# Text sensor with simple filtering
text_sensor:
  - platform: uart_readline
    uart_id: uart_bus
    name: "Barcode Scanner"
    id: barcode_scanner
    icon: "mdi:barcode-scan"
    filters:
      # Simple filter to remove unwanted single characters
      - lambda: |-
          // Ignore single 'u' from stop command
          if (x == "u" || x == "u\x02" || x == "u\x02\x00" || x == "u\x02\x00\x00") {
            return {};
          }
          // Ignore initialization echoes
          if (x == "B@" || x == "aA" || x == "vB" || x == "cF" || x == "@" || x == "A" || x == "B" || x == "F") {
            return {};
          }
          // Ignore protocol responses that start with these bytes
          if (x.length() > 0 && (x[0] == '"' || x[0] == '$' || x[0] == '3' || x[0] == 'D')) {
            return {};
          }
          // Only accept strings with at least 3 characters (real barcodes)
          if (x.length() < 3) {
            return {};
          }
          return x;
    on_value:
      then:
        - logger.log:
            format: "Barcode scanned: %s"
            args: ['x.c_str()']
        - light.turn_on:
            id: led_indicator
            effect: "None"
            red: 100%
            green: 100%
            blue: 100%
        - delay: 500ms
        - script.execute: update_led

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

button:
  - platform: template
    name: "Test Manual Scan"
    on_press:
      - if:
          condition:
            lambda: 'return id(scanner_enabled) && !id(scanning_active);'
          then:
            - lambda: 'id(scanning_active) = true;'
            - script.execute: update_led
            - uart.write:
                id: uart_bus
                data: [0x32, 0x75, 0x01]
            - delay: 3s
            - uart.write:
                id: uart_bus
                data: [0x32, 0x75, 0x02]
            - lambda: 'id(scanning_active) = false;'
            - script.execute: update_led